<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОК 😂</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #111, #333);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.box {
    padding: 35px 25px;
    width: 85%;
    max-width: 400px;
    border-radius: 25px;
    background: #1d1d1d;
}

h1 {
    font-size: 50px;
    margin: 0 0 15px;
}

p {
    font-size: 20px;
}

button {
    margin-top: 20px;
    padding: 16px 30px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

#text {
    margin-top: 20px;
    font-size: 22px;
}
</style>
</head>

<body>

<div class="box">
    <h1>ОК 😂</h1>

    <p>Ты активировал NFC-метку!</p>

    <button onclick="playSound()">НАЖМИ 😈</button>

    <div id="text"></div>
</div>

<script>
function playSound() {
    const audio = new Audio("AUD-20260902-WA0043.mp3");

    audio.play();

    document.getElementById("text").textContent =
        "АХАХАХА 😂";
}
</script>

</body>
</html>
