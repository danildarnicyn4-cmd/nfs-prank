<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОК 😂</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #111, #333);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.box {
    padding: 35px 25px;
    width: 85%;
    max-width: 400px;
    border-radius: 25px;
    background: #1d1d1d;
}

h1 {
    font-size: 50px;
    margin: 0 0 15px;
}

p {
    font-size: 20px;
}

button {
    margin-top: 20px;
    padding: 16px 30px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

#text {
    margin-top: 20px;
    font-size: 22px;
}
</style>
</head>

<body>

<div class="box">
    <h1>ОК 😂</h1>

    <p>Ты активировал NFC-метку!</p>

    <button onclick="laugh()">НАЖМИ 😈</button>

    <div id="text"></div>
</div>

<script>
function laugh() {

    const AudioContext =
        window.AudioContext || window.webkitAudioContext;

    const audio = new AudioContext();

    for (let i = 0; i < 10; i++) {

        let osc = audio.createOscillator();
        let gain = audio.createGain();

        let time = audio.currentTime + i * 0.16;

        osc.type = "square";

        osc.frequency.setValueAtTime(
            180 + Math.random() * 80,
            time
        );

        gain.gain.setValueAtTime(0.01, time);
        gain.gain.exponentialRampToValueAtTime(
            0.15,
            time + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            time + 0.13
        );

        osc.connect(gain);
        gain.connect(audio.destination);

        osc.start(time);
        osc.stop(time + 0.14);
    }

    document.getElementById("text").textContent =
        "АХАХАХА 😂";
}
</script>

</body>
</html>
